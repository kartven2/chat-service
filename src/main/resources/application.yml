server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/chatdb
    username: chatuser
    password: chatpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

chat:
  jwt:
    secret: "f3c2a1b4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2"
    expiration-ms: 86400000   # 24 hours

  server:
    instance-id: chat-server-1          # override per instance in prod
    zookeeper:
      connect-string: localhost:2181
      namespace: chat-service
      session-timeout-ms: 30000
      connection-timeout-ms: 10000

  group:
    max-members: 100

  presence:
    heartbeat-ttl-seconds: 10           # Redis TTL for online key
    heartbeat-interval-ms: 5000         # client expected heartbeat

  rabbitmq:
    direct-exchange: chat.direct        # 1-1 messages
    group-exchange: chat.group          # group messages (topic)
    dlx-exchange: chat.dlx              # dead-letter

logging:
  level:
    com.example.chat: DEBUG
    org.springframework.web.socket: INFO
